# Local / compose stack. Each image builds from that component folder only.
# Usage (repo root): docker compose up --build

services:
  document-processing-mcp:
    build:
      context: ./document-processing-mcp
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DOCUMENT_MCP_HOST: "0.0.0.0"
      DOCUMENT_MCP_PORT: "8001"
      DOCUMENT_PROMPTS_DIR: /app/prompts
      STORAGE_BASE_PATH: /home/data/storage
      SQLITE_DATABASE_PATH: /home/data/app.db
    volumes:
      - app-data:/home/data
      - ./document-processing-mcp/prompts:/app/prompts:ro
      - ./samples:/app/samples:ro

  voice-enable-mcp:
    build:
      context: ./voice_enable_mcp
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      VOICE_MCP_HOST: "0.0.0.0"
      VOICE_MCP_PORT: "8002"
      VOICE_PROMPTS_DIR: /app/prompts
      STORAGE_BASE_PATH: /home/data/storage
      SQLITE_DATABASE_PATH: /home/data/app.db
      # HITL checkpoints: sql (default, shared SQLite volume) or redis:
      # LANGGRAPH_CHECKPOINT_BACKEND: redis
      # REDIS_URL: redis://redis:6379/0
    volumes:
      - app-data:/home/data
      - ./voice_enable_mcp/prompts:/app/prompts:ro
      - ./samples:/app/samples:ro

  central-agentic-flow:
    build:
      context: ./central-agentic-flow
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      MAF_HOST: "0.0.0.0"
      MAF_PORT: "8003"
      MAF_PROMPTS_DIR: /app/prompts
      MAF_MCP_REGISTRY_FILE: /app/config/mcp_registry.yml
      DOCUMENT_MCP_URL: http://document-processing-mcp:8001/mcp
      VOICE_MCP_URL: http://voice-enable-mcp:8002/mcp
      STORAGE_BASE_PATH: /home/data/storage
      SQLITE_DATABASE_PATH: /home/data/app.db
    volumes:
      - app-data:/home/data
      - ./central-agentic-flow/prompts:/app/prompts:ro
      - ./central-agentic-flow/config:/app/config:ro
    depends_on:
      - document-processing-mcp
      - voice-enable-mcp

  ip-api:
    build:
      context: ./ipp_agentic_api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      MAF_BASE_URL: http://central-agentic-flow:8003
      STORAGE_BASE_PATH: /home/data/storage
      SQLITE_DATABASE_PATH: /home/data/app.db
    volumes:
      - app-data:/home/data
      - ./samples:/app/samples:ro
    depends_on:
      - central-agentic-flow

  ui:
    build:
      context: ./UI
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      GRADIO_HOST: "0.0.0.0"
      GRADIO_PORT: "7860"
      API_BASE_URL: http://ip-api:8000
    depends_on:
      - ip-api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["redis"]

volumes:
  app-data:
