# Local / compose stack for all self-contained components.
# Usage (repo root): docker compose up --build

services:
  document-processing-mcp:
    build:
      context: .
      dockerfile: document-processing-mcp/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DOCUMENT_MCP_HOST: "0.0.0.0"
      DOCUMENT_MCP_PORT: "8001"
      DOCUMENT_PROMPTS_DIR: /app/document-processing-mcp/prompts
      STORAGE_BASE_PATH: /home/data/storage
      SQLITE_DATABASE_PATH: /home/data/app.db
    volumes:
      - app-data:/home/data
      - ./document-processing-mcp/prompts:/app/document-processing-mcp/prompts:ro
      - ./samples:/app/samples:ro

  voice-enable-mcp:
    build:
      context: .
      dockerfile: voice_enable_mcp/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      VOICE_MCP_HOST: "0.0.0.0"
      VOICE_MCP_PORT: "8002"
      VOICE_PROMPTS_DIR: /app/voice_enable_mcp/prompts
      STORAGE_BASE_PATH: /home/data/storage
      SQLITE_DATABASE_PATH: /home/data/app.db
    volumes:
      - app-data:/home/data
      - ./voice_enable_mcp/prompts:/app/voice_enable_mcp/prompts:ro
      - ./samples:/app/samples:ro

  central-agentic-flow:
    build:
      context: .
      dockerfile: central-agentic-flow/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      MAF_HOST: "0.0.0.0"
      MAF_PORT: "8003"
      MAF_PROMPTS_DIR: /app/central-agentic-flow/prompts
      DOCUMENT_MCP_URL: http://document-processing-mcp:8001/mcp
      VOICE_MCP_URL: http://voice-enable-mcp:8002/mcp
    volumes:
      - ./central-agentic-flow/prompts:/app/central-agentic-flow/prompts:ro
    depends_on:
      - document-processing-mcp
      - voice-enable-mcp

  ip-api:
    build:
      context: .
      dockerfile: ip_api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      DOCUMENT_MCP_URL: http://document-processing-mcp:8001/mcp
      VOICE_MCP_URL: http://voice-enable-mcp:8002/mcp
      MAF_BASE_URL: http://central-agentic-flow:8003
      DOCUMENT_PROMPTS_DIR: /app/document-processing-mcp/prompts
      STORAGE_BASE_PATH: /home/data/storage
      SQLITE_DATABASE_PATH: /home/data/app.db
    volumes:
      - app-data:/home/data
      - ./document-processing-mcp/prompts:/app/document-processing-mcp/prompts:ro
      - ./samples:/app/samples:ro
    depends_on:
      - document-processing-mcp
      - voice-enable-mcp
      - central-agentic-flow

  ui:
    build:
      context: .
      dockerfile: UI/Dockerfile
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      GRADIO_HOST: "0.0.0.0"
      GRADIO_PORT: "7860"
      API_BASE_URL: http://ip-api:8000
    depends_on:
      - ip-api

volumes:
  app-data:
