[project]
name = "ip-api"
version = "0.1.0"
description = "ipp_agentic_api — FastAPI gateway (self-contained; talks to MCPs/MAF over HTTP)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "dynaconf>=3.2.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.28.0",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-groq>=0.3.0",
    "langgraph>=0.4.0",
    "python-docx>=1.1.0",
    "lxml>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "websockets>=15.0.0",
    "fastmcp>=3.4.6",
    "sqlalchemy>=2.0.0",
    "pymssql>=2.2.11",
    "pyodbc>=5.0.0",
    "azure-storage-blob>=12.19.0",
]

[project.scripts]
doc-api = "ip_api.api.server:main"
ipp_agentic_api = "ip_api.api.server:main"
doc-all = "ip_api.run_app:main"
doc-app = "ip_api.run_app:main"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

