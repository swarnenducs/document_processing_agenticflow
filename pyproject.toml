[project]
name = "document-processing-agenticflow"
version = "0.2.0"
description = "Monorepo: self-contained UI, ipp_agentic_api, document/voice MCPs, central-agentic-flow (MAF)"
readme = "README.md"
requires-python = ">=3.11"
# Local workspace members only — NOT published to PyPI.
# uv resolves them via [tool.uv.sources] below.
# Plain pip cannot resolve these names: use requirements-workspace.txt instead.
dependencies = [
    "document-processing-mcp",
    "voice-enable-mcp",
    "central-agentic-flow",
    "ip-api",
    "ui-app",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = [
    "document-processing-mcp",
    "voice_enable_mcp",
    "central-agentic-flow",
    "ipp_agentic_api",
    "UI",
]

[tool.uv.sources]
document-processing-mcp = { workspace = true }
voice-enable-mcp = { workspace = true }
central-agentic-flow = { workspace = true }
ip-api = { workspace = true }
ui-app = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = [
    "document-processing-mcp/tests",
    "voice_enable_mcp/tests",
    "central-agentic-flow/tests",
    "ipp_agentic_api/tests",
    "UI/tests",
]
pythonpath = [
    "document-processing-mcp/src",
    "voice_enable_mcp/src",
    "central-agentic-flow/src",
    "ipp_agentic_api/src",
    "UI/src",
]
