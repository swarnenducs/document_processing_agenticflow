[project]
name = "central-agentic-flow"
version = "0.1.0"
description = "MAF orchestrator (self-contained; own prompts/)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "agent-framework-core>=1.13.0",
    "agent-framework-openai>=1.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
doc-maf = "central_agentic_flow.server:main"
doc-maf-ask = "central_agentic_flow.cli:main"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"
