# Central agent MCP registry (YAML).
# Add a new MCP by copying a server block — no Python change required.
#
# Invoke modes (kept segregated on purpose):
#   ask   — LLM chat (/ask and the Foundry hosted agent) may call this MCP
#   jobs  — API /invoke (document jobs, voice REST) may call this MCP
#
# Document and voice are jobs-only: the LLM never picks those tools.
# Business question answering is a separate ask-only MCP.
#
# URLs support ${ENV} and ${ENV:-default}.
# Document: TEMPLATE_PROCESSING_END_POINT (alias DOCUMENT_MCP_URL).
# Voice: VOICE_PROCESSING_END_POINT (alias VOICE_MCP_URL).
# Optional ask: BUSINESS_MCP_URL; CHAT_MCP_END_POINT (alias CHAT_MCP_URL).
# Optional jobs: METADATA_EXTRACTION_END_POINT (alias METADATA_MCP_URL).
# Optional: instructions_file (markdown next to this file or under prompts/).

orchestrator:
  instructions_file: orchestrator_instructions.md

servers:
  - name: contract-autocreation-mcp
    aliases: [document, template-auto-creation]
    mcp: contract_autocreation_mcp
    enabled: true
    url: "${TEMPLATE_PROCESSING_END_POINT:-http://127.0.0.1:8001/mcp}"
    prefix: document
    description: Template auto-creation — fill a Word .docx from JSON (LangGraph).
    invoke:
      modes: [jobs]
      default_tool: generate_document
      tools:
        health:
          when: "Ping document MCP liveness."
        generate_document:
          when: >
            Fill a Word .docx from a template and JSON. Use for generate-document
            jobs and when the user asks to create/fill a contract or template.
          request:
            required: [template_path]
            optional:
              [data_path, data_json, output_path, job_id, xid, skip_validation,
               skip_extraction_validation, max_retries, validation_threshold]
    instructions: |
      Call document_generate_document with template_path and either data_path or data_json.
      Paths may be local files or Azure Blob refs
      (blob://container/jobs/{job_id}/upload/... or .../download/...).
      Pass job_id when a document job already exists so SQL/accuracy can be updated.

  - name: voice-agent
    aliases: [voice]
    mcp: voice_process_mcp
    enabled: true
    url: "${VOICE_PROCESSING_END_POINT:-http://127.0.0.1:8002/mcp}"
    prefix: voice
    description: Voice agent — spoken/typed create-contract with human-in-the-loop confirm.
    invoke:
      modes: [jobs]
      default_tool: start_voice_contract
      tools:
        health:
          when: "Ping voice MCP liveness."
        start_voice_contract:
          when: "User wants to create a contract from spoken or typed text."
          request:
            required: [transcript]
            optional: [auto_create]
        confirm_voice_contract:
          when: "User confirmed the legal entity and contract reference (HITL resume)."
          request:
            required: [legal_entity, contract_reference_number]
            optional: [thread_id, user_text, transcript]
        list_voice_contracts:
          when: "User asks to list saved voice contracts."
          request:
            optional: [limit]
    instructions: |
      Call voice_start_voice_contract with the transcript.
      If the tool returns needs_confirmation, ask the user then call
      voice_confirm_voice_contract (prefer thread_id from the start response).

  # Business question answering for the chat path (/ask and the Foundry agent).
  # Not shipped in this repo: the entry activates only when BUSINESS_MCP_URL is set,
  # otherwise the URL resolves empty and the server is skipped.
  - name: business-agent
    aliases: [business]
    mcp: business_process_mcp
    enabled: true
    url: "${BUSINESS_MCP_URL:-}"
    prefix: business
    description: Business prompt responses — domain question answering for chat.
    invoke:
      modes: [ask]
    instructions: |
      Answer business questions with the business_* tools; never invent a business answer.
      Document generation and voice contracts are not available here — they run as
      API jobs. If asked for one, say it must be submitted through the API.

  # Optional chat MCP for /ask and the Foundry hosted agent. Sibling of
  # business-agent — both can be enabled. Activates only when
  # CHAT_MCP_END_POINT (alias CHAT_MCP_URL) is set.
  - name: chat-agent
    aliases: [chat]
    mcp: chat_process_mcp
    enabled: true
    url: "${CHAT_MCP_END_POINT:-}"
    prefix: chat
    description: General chat MCP — conversational tools for /ask (not jobs).
    invoke:
      modes: [ask]
    instructions: |
      Answer with the chat_* tools; never invent a chat-tool result.
      Document generation, metadata extraction, and voice contracts are not
      available here — they run as API jobs. If asked for one, say it must
      be submitted through the API.

  # Optional metadata extraction MCP for POST /invoke jobs. Activates only when
  # METADATA_EXTRACTION_END_POINT (alias METADATA_MCP_URL) is set.
  # Foundry Toolbox is chat-only — do not attach this server there.
  - name: metadata-agent
    aliases: [metadata]
    mcp: metadata_process_mcp
    enabled: true
    url: "${METADATA_EXTRACTION_END_POINT:-}"
    prefix: metadata
    description: Metadata extraction — pull structured metadata from a document (jobs).
    invoke:
      modes: [jobs]
      default_tool: extract_metadata
      tools:
        health:
          when: "Ping metadata MCP liveness."
        extract_metadata:
          when: >
            Extract structured metadata from a document. Use for metadata-extraction
            jobs once this MCP is deployed.
          request:
            required: [source_path]
            optional: [job_id, xid, schema]
    instructions: |
      Call metadata_extract_metadata with source_path. Pass job_id when a job
      already exists. This server is jobs-only — never expose it on /ask or
      a Foundry Toolbox.

  # Example extra MCP — set enabled: true and a live URL (or MAF_EXTRA_MCPS).
  - name: fabric-sql-agent
    aliases: [fabric]
    mcp: fabric_sql_agent_mcp
    enabled: false
    url: "${FABRIC_SQL_AGENT_URL:-http://127.0.0.1:8004/mcp}"
    prefix: fabric
    description: Fabric SQL agent (warehouse / lakehouse query).
    invoke:
      modes: [ask]
      default_tool: run_sql
      tools:
        list_tables:
          when: "User asks which Fabric SQL tables or lakehouse tables exist."
        describe_table:
          when: "User asks for a Fabric table schema."
          request:
            required: [table]
        run_sql:
          when: "User asks to query Fabric SQL / warehouse / lakehouse data."
          request:
            required: [sql]
            optional: [limit, warehouse]
    instructions: |
      Call fabric_list_tables or fabric_describe_table to discover schema.
      Call fabric_run_sql with the SQL; never invent query results.
