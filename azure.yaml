# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: ">=1.0.0-beta.4"

name: document-maf-foundry

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-4.1-mini
        model:
          format: OpenAI
          name: gpt-4.1-mini
          version: "2025-04-14"
        sku:
          name: GlobalStandard
          capacity: 10

  document-maf-foundry:
    host: azure.ai.agent
    kind: hosted
    name: document-maf-foundry
    description: MAF document and voice orchestrator hosted in Microsoft Foundry.
    project: central-agentic-flow
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: foundry_main.py
      dependencyResolution: remote_build
    uses:
      - ai-project
    protocols:
      - protocol: responses
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: TOOLBOX_ENDPOINT
        value: ${TOOLBOX_ENDPOINT}
    container:
      resources:
        cpu: "1"
        memory: 2Gi

infra:
  provider: microsoft.foundry
